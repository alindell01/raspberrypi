<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Scoreboard</title>
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/theme-sabres.css">
</head>
<body>

  <section id="picker" class="view active">
    <div class="picker-card">
      <h1>Pi Scoreboard</h1>
      <p class="subtitle">Choose a game</p>

      <div class="row">
        <label for="league">League</label>
        <select id="league">
          <option value="nhl">NHL</option>
          <option value="nfl">NFL</option>
        </select>
      </div>

      <div class="row">
        <label for="date">Date</label>
        <input type="date" id="date">
      </div>

      <div class="row">
        <label for="game">Game</label>
        <select id="game"><option>Loading...</option></select>
      </div>

      <button id="go">Show Scoreboard</button>
      <p class="hint">Press Esc or B on the scoreboard to return here.</p>
    </div>
  </section>

  <section id="scoreboard" class="view">
    <div class="ribbon ribbon-top">
      <div class="ribbon-track" id="ribbon-top-text">Pi Scoreboard</div>
    </div>

    <main class="board">
      <div class="team team-away">
        <div class="team-logo"><img id="away-logo" alt=""></div>
        <div class="team-name" id="away-name">Away</div>
        <div class="team-score" id="away-score">0</div>
        <div class="team-extra" id="away-extra"></div>
      </div>

      <div class="center">
        <div class="period" id="period">--</div>
        <div class="clock" id="clock">--:--</div>
        <div class="status" id="status"></div>
        <div class="last-play" id="last-play"></div>
      </div>

      <div class="team team-home">
        <div class="team-logo"><img id="home-logo" alt=""></div>
        <div class="team-name" id="home-name">Home</div>
        <div class="team-score" id="home-score">0</div>
        <div class="team-extra" id="home-extra"></div>
      </div>
    </main>

    <div class="crossed-sabres" aria-hidden="true">
      <svg viewBox="0 0 600 60" preserveAspectRatio="xMidYMid meet">
        <g stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round">
          <line x1="40"  y1="50" x2="560" y2="10"/>
          <line x1="40"  y1="10" x2="560" y2="50"/>
          <circle cx="40"  cy="50" r="6" fill="currentColor"/>
          <circle cx="40"  cy="10" r="6" fill="currentColor"/>
          <circle cx="560" cy="50" r="6" fill="currentColor"/>
          <circle cx="560" cy="10" r="6" fill="currentColor"/>
        </g>
      </svg>
    </div>

    <div class="ribbon ribbon-bottom">
      <div class="ribbon-track" id="ribbon-bottom-text">Live</div>
    </div>

    <button class="back-btn" id="back" title="Back (Esc)">&larr; Back</button>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
