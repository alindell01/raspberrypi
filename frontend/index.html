<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Scoreboard</title>
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" id="theme-css" href="/styles/theme-sabres.css">
</head>
<body>

  <section id="picker" class="view active">
    <div class="picker-card">
      <h1>Pi Scoreboard</h1>
      <p class="subtitle">Choose a game</p>

      <div class="row">
        <label for="league">League</label>
        <select id="league">
          <option value="nhl">NHL</option>
          <option value="nfl">NFL</option>
        </select>
      </div>

      <div class="row">
        <label for="date">Date</label>
        <div class="date-wrap">
          <input type="text"
                 id="date"
                 placeholder="mm/dd/yyyy"
                 inputmode="numeric"
                 autocomplete="off"
                 maxlength="10"
                 pattern="\d{2}/\d{2}/\d{4}">
          <button type="button" id="date-pick" class="date-pick-btn" aria-label="Open calendar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="5" width="18" height="16" rx="2"/>
              <line x1="3"  y1="10" x2="21" y2="10"/>
              <line x1="8"  y1="3"  x2="8"  y2="7"/>
              <line x1="16" y1="3"  x2="16" y2="7"/>
            </svg>
          </button>
          <div id="date-popup" class="date-popup" hidden>
            <header class="cal-head">
              <button type="button" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
              <span id="cal-month-label">—</span>
              <button type="button" id="cal-next" aria-label="Next month">&rsaquo;</button>
            </header>
            <div id="cal-grid" class="cal-grid"></div>
            <footer class="cal-foot">
              <button type="button" id="cal-today">Today</button>
            </footer>
          </div>
        </div>
        <span class="date-hint">mm/dd/yyyy</span>
      </div>

      <div class="row">
        <label for="game">Game</label>
        <select id="game"><option>Loading...</option></select>
      </div>

      <div class="row">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="auto">Auto (by league)</option>
          <option value="sabres">Sabres / KeyBank (royal &amp; gold)</option>
          <option value="goathead">Sabres Goathead (black &amp; red)</option>
          <option value="slug">Sabres Slug (red &amp; silver)</option>
          <option value="bills">Bills / Highmark</option>
          <option value="generic">Generic dark</option>
        </select>
      </div>

      <div class="row">
        <label for="delay">Broadcast delay</label>
        <select id="delay">
          <option value="0">Live (no delay)</option>
          <option value="15">15 seconds</option>
          <option value="30">30 seconds</option>
          <option value="60">1 minute</option>
          <option value="120">2 minutes</option>
          <option value="300">5 minutes</option>
          <option value="600">10 minutes</option>
        </select>
      </div>

      <button id="go">Show Scoreboard</button>
      <p class="hint">Press Esc or B on the scoreboard to return here.</p>
    </div>
  </section>

  <section id="scoreboard" class="view">
    <header class="arena-banner" id="arena-banner" hidden>
      <img id="arena-img" alt="">
      <div class="arena-overlay">
        <div class="arena-name" id="arena-name"></div>
        <div class="series-badge" id="series-badge" hidden></div>
      </div>
    </header>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="kb-key" viewBox="0 0 100 30">
          <g fill="#E2061B">
            <circle cx="14" cy="8"  r="7"/>
            <circle cx="14" cy="22" r="7"/>
            <circle cx="7"  cy="15" r="7"/>
            <circle cx="21" cy="15" r="7"/>
            <rect x="20" y="12" width="62" height="6"/>
            <rect x="70" y="18" width="4"  height="9"/>
            <rect x="78" y="18" width="4"  height="7"/>
          </g>
          <circle cx="14" cy="15" r="3" fill="#0a0a0a"/>
        </symbol>
      </defs>
    </svg>

    <div class="ribbon ribbon-top">
      <div class="ribbon-track" id="ribbon-top-text">Pi Scoreboard</div>
    </div>

    <main class="board">
      <div class="rail-column" id="away-rail" hidden>
        <div class="team-stats stat-rail" id="away-stats" hidden></div>
        <div class="team-leader" id="away-leader" hidden></div>
      </div>

      <div class="team team-away">
        <div class="team-logo"><img id="away-logo" alt=""></div>
        <div class="team-name" id="away-name">Away</div>
        <div class="team-record" id="away-record"></div>
        <div class="team-score" id="away-score">0</div>
        <div class="team-goalie" id="away-goalie" hidden></div>
      </div>

      <div class="center">
        <div class="period" id="period">--</div>
        <div class="clock" id="clock">--:--</div>
        <div class="power-play" id="power-play" hidden>
          <span class="pp-kind"  id="pp-kind">POWER PLAY</span>
          <span class="pp-team"  id="pp-team"></span>
          <span class="pp-time"  id="pp-time"></span>
        </div>
        <div class="situation" id="situation" hidden>
          <span class="poss-arrow" id="poss-arrow-left">&#9664;</span>
          <span class="down-distance" id="down-distance"></span>
          <span class="poss-arrow" id="poss-arrow-right">&#9654;</span>
          <div class="yardline" id="yardline"></div>
        </div>
        <div class="status" id="status"></div>
        <div class="last-play" id="last-play"></div>
        <table class="line-score" id="line-score" hidden></table>
      </div>

      <div class="team team-home">
        <div class="team-logo"><img id="home-logo" alt=""></div>
        <div class="team-name" id="home-name">Home</div>
        <div class="team-record" id="home-record"></div>
        <div class="team-score" id="home-score">0</div>
        <div class="team-goalie" id="home-goalie" hidden></div>
      </div>

      <div class="rail-column" id="home-rail" hidden>
        <div class="team-stats stat-rail" id="home-stats" hidden></div>
        <div class="team-leader" id="home-leader" hidden></div>
      </div>
    </main>

    <div class="ribbon ribbon-bottom">
      <div class="ribbon-track" id="ribbon-bottom-text">Live</div>
    </div>

    <div class="celebration" id="celebration" aria-hidden="true">
      <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">
        <g fill="currentColor">
          <circle class="puff" cx="100" cy="100" r="20"/>
          <circle class="puff puff-2" cx="70"  cy="110" r="14"/>
          <circle class="puff puff-3" cx="130" cy="110" r="14"/>
          <circle class="puff puff-4" cx="85"  cy="80"  r="10"/>
          <circle class="puff puff-5" cx="115" cy="80"  r="10"/>
        </g>
      </svg>
    </div>

    <button class="back-btn" id="back" title="Back (Esc)">&larr; Back</button>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
