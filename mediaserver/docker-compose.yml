# ─────────────────────────────────────────────────────────────
#  Media automation stack for an EXISTING Plex server (Windows + Docker Desktop)
#
#  Phone (Overseerr) → Prowlarr → Radarr/Sonarr → qBittorrent → 4TB drive → Plex
#
#  Plex itself is NOT in here — it stays running natively on Windows as you have it.
#  Every app below generates its OWN fresh API keys on first launch.
#
#  All apps share one mount: ${DATA_DIR} → /data
#  so downloads (/data/downloads) and media (/data/media) sit on ONE volume.
#  That makes imports instant (hardlinks) and avoids double-storing while seeding.
# ─────────────────────────────────────────────────────────────

services:
  # ── Indexer manager: one place to add all your torrent indexers ──
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696

  # ── Movies: grabs, renames, places into /data/media/movies ──
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - ${DATA_DIR}:/data
    ports:
      - 7878:7878

  # ── TV: grabs, renames, places into /data/media/tv ──
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - ${DATA_DIR}:/data
    ports:
      - 8989:8989

  # ── Music: grabs, tags, places into /data/media/music ──
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/lidarr:/config
      - ${DATA_DIR}:/data
    ports:
      - 8686:8686

  # ── PIA VPN tunnel. qBittorrent routes ALL its traffic through this. ──
  #    If the tunnel drops, qBittorrent loses network too (kill-switch) —
  #    so torrent traffic never leaks to your real IP.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASS}
      - SERVER_REGIONS=${PIA_REGION}
      - VPN_PORT_FORWARDING=on          # better seeding / ratio on private trackers
      - PORT_FORWARD_ONLY=on
      - TZ=${TZ}
    volumes:
      - ./config/gluetun:/gluetun
    ports:
      # qBittorrent's ports are published HERE because it shares gluetun's network.
      - 18080:8080     # qBittorrent web UI  (host 18080 → container 8080)
      - 6881:6881      # torrent traffic
      - 6881:6881/udp

  # ── Download client — shares gluetun's network (no ports of its own). ──
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_DIR}:/data

  # ── The phone app: search & request, logs in with your Plex account.
  #    Seerr is the maintained successor to Overseerr. It reuses the same config
  #    folder and auto-migrates the existing Overseerr data on first start.
  #    (Runs as UID 1000, needs init:true, config lives at /app/config.) ──
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PORT=5055
    volumes:
      - ./config/overseerr:/app/config
    ports:
      - 5055:5055
    # Lets Seerr reach Plex running natively on the Windows host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Books/audiobooks auto-grabber (the maintained replacement for the retired
  #    Readarr). Follows authors, grabs via IPTorrents → qBittorrent into
  #    /data/media/books. Optional. ──
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/lazylibrarian:/config
      - ${DATA_DIR}:/data
    ports:
      - 5299:5299

  # ── Audiobook + ebook SERVER/player (what Plex is bad at). Great phone apps.
  #    Serves what's in /data/media/audiobooks and /data/media/books. Optional. ──
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/audiobookshelf:/config
      - ./config/audiobookshelf-metadata:/metadata
      - ${DATA_DIR}:/data
    ports:
      - 13378:80
